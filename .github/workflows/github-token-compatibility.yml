name: GitHub App installation token compatibility

on:
  push:
    branches: [test/github-app-token-compatibility]
  pull_request:
    branches: [main]
    paths:
      - "src/server/githubInstallationToken.mjs"
      - "scripts/test-github-installation-token.mjs"
      - ".github/workflows/github-token-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Classic and stateless token compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Test both installation token formats
        run: node scripts/test-github-installation-token.mjs
