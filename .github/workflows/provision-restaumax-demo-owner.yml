name: Provision existing owner — RestauMax Demo only

on:
  push:
    branches: [main]
    paths:
      - 'scripts/provision-restaumax-demo-owner.mjs'
      - '.github/workflows/provision-restaumax-demo-owner.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run vérifie le compte et la cible ; apply rattache le propriétaire"
        required: true
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "Pour apply manuel, saisir PROVISION_RESTAUMAX_DEMO_OWNER"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: restaumax-demo-owner-provisioning
  cancel-in-progress: false

jobs:
  provision-owner:
    if: github.ref == 'refs/heads/main'
    environment: demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: restaumax-demo
      FIRESTORE_DATABASE_ID: (default)
      PROVISION_MODE: ${{ github.event_name == 'push' && 'apply' || inputs.mode }}
      PROVISION_CONFIRMATION: ${{ github.event_name == 'push' && 'PROVISION_RESTAUMAX_DEMO_OWNER' || inputs.confirmation }}
    steps:
      - name: Validate immutable Demo target and explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FIREBASE_PROJECT_ID" = "restaumax-demo"
          test "$FIRESTORE_DATABASE_ID" = "(default)"
          if [[ "$PROVISION_MODE" == "apply" && "$PROVISION_CONFIRMATION" != "PROVISION_RESTAUMAX_DEMO_OWNER" ]]; then
            echo "::error::Confirmation explicite requise pour rattacher le compte propriétaire."
            exit 1
          fi
          echo "Cible immuable validée : restaumax-demo / (default). Production est exclue."

      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate provisioning safeguards
        run: node scripts/test-onboarding-reset-email.mjs

      - name: Authenticate with short-lived GitHub OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: gen-lang-client-0138815290
          workload_identity_provider: projects/305138716873/locations/global/workloadIdentityPools/github-restaumax-pool/providers/github-restaumax-provider
          service_account: restaumax-firestore-deployer@gen-lang-client-0138815290.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Run Demo-only dry-run or provisioning
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROVISION_MODE" == "apply" ]]; then
            node scripts/provision-restaumax-demo-owner.mjs --apply
          else
            node scripts/provision-restaumax-demo-owner.mjs
          fi
