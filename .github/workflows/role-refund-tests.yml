name: Role refund tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/test-role-ceilings.mjs
      - run: node scripts/test-firestore-owner-rule.mjs
      - run: npx tsx scripts/test-refund-service.mjs
