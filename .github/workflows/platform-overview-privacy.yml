name: Platform overview privacy regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/platformAdmin.ts'
      - 'scripts/test-platform-overview-sanitization.mjs'
      - '.github/workflows/platform-overview-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/test-platform-overview-sanitization.mjs
