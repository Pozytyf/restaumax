name: Platform overview privacy regression
on:
  pull_request:
    branches: [main, fix/separate-platform-admin-login]
    paths:
      - 'src/server/platformAdmin.ts'
      - 'scripts/test-platform-overview-sanitization.mjs'
      - '.github/workflows/platform-overview-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/test-platform-overview-sanitization.mjs
