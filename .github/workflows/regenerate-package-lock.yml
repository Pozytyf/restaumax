name: Regenerate package lock for Firebase Admin Auth compatibility

on:
  push:
    branches:
      - feature/platform-admin-roles
    paths:
      - package.json
      - .github/workflows/regenerate-package-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/platform-admin-roles
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile with dependency overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): regenerate lockfile for jose compatibility"
            git push origin HEAD:feature/platform-admin-roles
          else
            echo "package-lock.json is already up to date."
          fi
