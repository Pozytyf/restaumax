name: RestauMax CI

on:
  push:
    branches: [main, fix/authorization-refunds-platform-audit, stabilize/ai-studio-sync-2026-11-06]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile from package manifest (temporary stabilization)
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Preserve regenerated lockfile for repository reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 7
