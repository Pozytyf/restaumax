name: RestauMax CI

on:
  push:
    branches: [main, fix/authorization-refunds-platform-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Firestore Emulator tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Start Firestore Emulator and run strict integration suite
        env:
          FIRESTORE_EMULATOR_STRICT: "true"
        run: npx --yes firebase-tools@14.22.0 emulators:exec --project demo-restaumax --only firestore --config firebase.json "npm run test:emulator"

      - name: Run remaining automated tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high
