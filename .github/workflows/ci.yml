name: RestauMax CI

on:
  push:
    branches: [main, fix/authorization-refunds-platform-audit]
  pull_request:
    branches: [main, fix/separate-platform-admin-login, fix/qr-table-session-diagnostics]

  workflow_dispatch:
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Firestore Emulator tests and production build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --trace-deprecation
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test Firestore index readiness matching
        run: node scripts/test-firestore-index-status.mjs

      - name: Start Firestore Emulator and run the complete test suite
        env:
          FIRESTORE_EMULATOR_STRICT: "true"
        run: npx --yes firebase-tools@14.22.0 emulators:exec --project demo-restaumax --only firestore --config firebase.json "npm test"

      - name: Build production frontend
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high
