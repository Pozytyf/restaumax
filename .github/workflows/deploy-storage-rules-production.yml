name: Deploy Firebase Storage Rules — Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmer explicitement la publication des règles Storage sur Firebase Production"
        required: true
        type: choice
        options:
          - "NO"
          - "DEPLOY_STORAGE_RULES_TO_PRODUCTION"

permissions:
  contents: read

concurrency:
  group: firebase-storage-rules-production
  cancel-in-progress: false

jobs:
  deploy-storage-rules:
    name: Publish Storage rules to the approved Production bucket
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: firebase-production

    permissions:
      contents: read
      id-token: write

    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0138815290
      FIREBASE_STORAGE_BUCKET: gen-lang-client-0138815290.firebasestorage.app

    steps:
      - name: Validate explicit Production confirmation
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ github.event.inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$CONFIRM_PRODUCTION" != "DEPLOY_STORAGE_RULES_TO_PRODUCTION" ]]; then
            echo "::error::Explicit Production confirmation missing or invalid, or branch is not main. No deployment performed."
            exit 1
          fi
          echo "Explicit Production confirmation accepted."

      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Validate Storage deployment configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOYER_SA }}
        run: |
          set -euo pipefail
          test "$FIREBASE_PROJECT_ID" = "gen-lang-client-0138815290"
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOY_SERVICE_ACCOUNT"
          test -f firebase.production.json
          test -f storage.rules

          CONFIGURED_BUCKET="$(node -e "process.stdout.write(require('./firebase-applet-config.json').storageBucket || '')")"
          test "$CONFIGURED_BUCKET" = "$FIREBASE_STORAGE_BUCKET" || {
            echo "::error::Storage bucket does not match the approved Production bucket."
            exit 1
          }

          node -e "const c=require('./firebase.production.json'); if(c.storage?.rules !== 'storage.rules') process.exit(1)"
          echo "Target Firebase project: $FIREBASE_PROJECT_ID"
          echo "Target Storage bucket: $FIREBASE_STORAGE_BUCKET"

      - name: Authenticate to Google Cloud using short-lived OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: gen-lang-client-0138815290
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Storage Security Rules to the Production bucket only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.34.2 deploy \
            --config firebase.production.json \
            --only storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Firebase Storage rules published"
            echo "- Firebase project: `$FIREBASE_PROJECT_ID`"
            echo "- Storage bucket: `$FIREBASE_STORAGE_BUCKET`"
            echo "- Source: `storage.rules` from `main`"
            echo "- Scope: Storage Security Rules only"
            echo "- Commit: `$GITHUB_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"
