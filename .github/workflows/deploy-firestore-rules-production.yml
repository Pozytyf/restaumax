
name: Deploy Firestore Rules — Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmer explicitement la publication des règles sur Firebase Production"
        required: true
        type: choice
        options:
          - "NO"
          - "DEPLOY_FIRESTORE_RULES_TO_PRODUCTION"

permissions:
  contents: read

concurrency:
  group: firebase-firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    name: Publish Firestore rules to the approved Production database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: firebase-production

    permissions:
      contents: read
      id-token: write

    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0138815290
      FIRESTORE_DATABASE_ID: ai-studio-restomax-85affd15-48b4-463e-b365-b881673ebbcf

    steps:
      - name: Validate explicit Production confirmation
        shell: bash
        env:
          CONFIRM_PRODUCTION: ${{ github.event.inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$CONFIRM_PRODUCTION" != "DEPLOY_FIRESTORE_RULES_TO_PRODUCTION" ]]; then
            echo "::error::Explicit Production confirmation missing or invalid, or branch is not main. No deployment performed."
            exit 1
          fi
          echo "Explicit Production confirmation accepted."

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOYER_SA }}
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Deployment is allowed only from main."
            exit 1
          }

          test "$FIREBASE_PROJECT_ID" = "gen-lang-client-0138815290" || {
            echo "::error::Unexpected Firebase project."
            exit 1
          }

          test "$FIRESTORE_DATABASE_ID" = "ai-studio-restomax-85affd15-48b4-463e-b365-b881673ebbcf" || {
            echo "::error::Unexpected Firestore database."
            exit 1
          }

          test -n "$WIF_PROVIDER" || {
            echo "::error::Missing GCP_WIF_PROVIDER."
            exit 1
          }

          test -n "$DEPLOY_SERVICE_ACCOUNT" || {
            echo "::error::Missing GCP_FIREBASE_DEPLOYER_SA."
            exit 1
          }

          test -f firebase.production.json && test -f firestore.rules || {
            echo "::error::Production configuration or firestore.rules is missing."
            exit 1
          }

          echo "Target Firebase project: $FIREBASE_PROJECT_ID"
          echo "Target Firestore database: $FIRESTORE_DATABASE_ID"
          echo "Rules source: firestore.rules"

      - name: Authenticate to Google Cloud using short-lived OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: gen-lang-client-0138815290
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify that the Production database already exists
        shell: bash
        run: |
          set -euo pipefail

          npx --yes firebase-tools@15.34.2 firestore:databases:get "$FIRESTORE_DATABASE_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

          echo "Existing Production database verified."

      - name: Deploy Firestore Security Rules to the named database only
        shell: bash
        run: |
          set -euo pipefail

          npx --yes firebase-tools@15.34.2 deploy \
            --config firebase.production.json \
            --only "firestore:$FIRESTORE_DATABASE_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Firestore rules published"
            echo "- Firebase project: \`$FIREBASE_PROJECT_ID\`"
            echo "- Firestore database: \`$FIRESTORE_DATABASE_ID\`"
            echo "- Source: \`firestore.rules\` from \`main\`"
            echo "- Scope: Firestore Security Rules only"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
