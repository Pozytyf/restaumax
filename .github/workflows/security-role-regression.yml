name: Security role regression
on:
  pull_request:
    branches: [main, fix/separate-platform-admin-login, fix/qr-table-session-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Role ceilings
        run: npx tsx scripts/test-role-ceilings.mjs
      - name: Full role boundaries
        run: npx tsx scripts/test-full-role-boundaries.mjs
      - name: Firestore owner binding
        run: node scripts/test-firestore-owner-rule.mjs
      - name: Atomic cash refund
        run: npx tsx scripts/test-refund-service.mjs
