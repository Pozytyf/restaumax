name: Deploy Firestore Rules — RestauMax Demo only

on:
  push:
    branches:
      - fix/firestore-restaurant-active-guard
    paths:
      - "firestore.rules"
      - "firebase.demo.json"
      - ".github/workflows/deploy-firestore-rules-demo.yml"

permissions:
  contents: read

concurrency:
  group: restaumax-demo-firestore-rules
  cancel-in-progress: false

jobs:
  deploy-demo-rules:
    name: Publish Firestore rules to restaumax-demo only
    if: github.ref == 'refs/heads/fix/firestore-restaurant-active-guard'
    environment:
      name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: restaumax-demo
      FIRESTORE_DATABASE_ID: (default)
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Validate immutable Demo target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/firestore-restaurant-active-guard"
          test "$FIREBASE_PROJECT_ID" = "restaumax-demo"
          test "$FIRESTORE_DATABASE_ID" = "(default)"
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::The Demo environment service-account secret is unavailable."
            exit 1
          fi
          echo "Target fixed: restaumax-demo / (default). Production is excluded."

      - name: Checkout the reviewed security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/firestore-restaurant-active-guard
          persist-credentials: false

      - name: Verify checked-out Demo deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase.demo.json
          test -f firestore.rules
          echo "Demo configuration and Firestore rules are present."

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Authenticate with the existing Demo service-account secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          jq -e '.type == "service_account" and (.client_email | type == "string")' "$RUNNER_TEMP/firebase-sa.json" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.2

      - name: Verify the existing Demo database before deployment
        shell: bash
        run: |
          set -euo pipefail
          firebase firestore:databases:get "$FIRESTORE_DATABASE_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          echo "Existing Demo database verified."

      - name: Deploy Firestore Security Rules to Demo only
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --config firebase.demo.json \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Firestore rules published to Demo"
            echo "- Firebase project: `$FIREBASE_PROJECT_ID`"
            echo "- Firestore database: `$FIRESTORE_DATABASE_ID`"
            echo "- Source: `firestore.rules`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Production: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
