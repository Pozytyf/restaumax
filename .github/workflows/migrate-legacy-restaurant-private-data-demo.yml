name: Migrate historical private metadata — RestauMax Demo only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run inspecte les restaurants ; apply migre les métadonnées historiques"
        required: true
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "Pour apply uniquement, saisir MIGRATE_RESTAUMAX_DEMO_PRIVATE_METADATA"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: restaumax-demo-private-metadata-migration
  cancel-in-progress: false

jobs:
  migrate-demo:
    if: github.ref == 'refs/heads/main'
    environment: demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: restaumax-demo
      FIRESTORE_DATABASE_ID: (default)
      MIGRATION_MODE: ${{ inputs.mode }}
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate immutable Demo target and write confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FIREBASE_PROJECT_ID" = "restaumax-demo"
          test "$FIRESTORE_DATABASE_ID" = "(default)"
          if [[ "$MIGRATION_MODE" == "apply" && "$MIGRATION_CONFIRMATION" != "MIGRATE_RESTAUMAX_DEMO_PRIVATE_METADATA" ]]; then
            echo "::error::Confirmation explicite requise pour migrer les données Demo."
            exit 1
          fi
          echo "Cible fixe validée : restaumax-demo / (default). Production est exclue."

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test migration target guards
        run: npm run test:migrate-demo

      - name: Authenticate with short-lived GitHub OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: gen-lang-client-0138815290
          workload_identity_provider: projects/305138716873/locations/global/workloadIdentityPools/github-restaumax-pool/providers/github-restaumax-provider
          service_account: restaumax-firestore-deployer@gen-lang-client-0138815290.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Execute Demo-only migration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_MODE" == "apply" ]]; then
            node scripts/migrate-legacy-restaurant-private-data-demo.mjs --apply
          else
            node scripts/migrate-legacy-restaurant-private-data-demo.mjs
          fi
