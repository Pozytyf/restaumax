name: Owner refund authorization regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/paymentService.ts'
      - 'scripts/test-owner-refund-binding.mjs'
      - '.github/workflows/owner-refund-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-refund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/test-owner-refund-binding.mjs
