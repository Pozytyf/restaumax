name: Import Sweet and Hot catalog — RestauMax Demo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run vérifie la cible ; apply écrit les 29 plats dans le projet Demo"
        required: true
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "Pour apply uniquement, saisir IMPORT_SWEET_HOT_DEMO_CATALOG"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sweet-hot-demo-catalog-import
  cancel-in-progress: false

jobs:
  import-catalog:
    if: github.ref == 'refs/heads/main'
    environment: demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: restaumax-demo
      FIRESTORE_DATABASE_ID: (default)
      IMPORT_MODE: ${{ inputs.mode }}
      IMPORT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate immutable Demo target and write confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FIREBASE_PROJECT_ID" = "restaumax-demo"
          test "$FIRESTORE_DATABASE_ID" = "(default)"
          if [[ "$IMPORT_MODE" == "apply" && "$IMPORT_CONFIRMATION" != "IMPORT_SWEET_HOT_DEMO_CATALOG" ]]; then
            echo "::error::Confirmation explicite requise pour écrire le catalogue Demo."
            exit 1
          fi
          echo "Cible fixe validée : projet restaumax-demo / base (default)."

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test catalog and Demo-only target guards
        run: npm run test:seed-sweet-hot

      - name: Authenticate with short-lived GitHub OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: gen-lang-client-0138815290
          workload_identity_provider: projects/305138716873/locations/global/workloadIdentityPools/github-restaumax-pool/providers/github-restaumax-provider
          service_account: restaumax-firestore-deployer@gen-lang-client-0138815290.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Run Demo-only dry-run or apply
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMPORT_MODE" == "apply" ]]; then
            node scripts/seed-sweet-and-hot-demo.mjs --apply
          else
            node scripts/seed-sweet-and-hot-demo.mjs
          fi
