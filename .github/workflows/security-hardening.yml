name: RestauMax security hardening

on:
  push:
    branches:
      - fix/security-full-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use npm 10 for deterministic dependency lifecycle scripts
        run: npm install --global npm@10.9.9

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm ci

      - name: Install ephemeral Firebase test tooling
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing@6.0.0

      - name: Run project test suite and Firestore security rules tests against real emulators
        run: npx firebase emulators:exec --project demo-restaumax --only firestore,auth "FIRESTORE_EMULATOR_STRICT=true npm test && npx tsx scripts/test-role-authorization.mjs && node scripts/test-security-rules.mjs"

      - name: TypeScript validation
        run: npm run lint

      - name: Production build validation
        run: npm run build
