name: RestauMax security hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Use npm 10 for deterministic dependency lifecycle scripts
        run: npm install --global npm@10.9.9

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm ci

      - name: Install ephemeral Firebase test tooling
        run: npm install --no-save firebase-tools@15.34.2 @firebase/rules-unit-testing@6.0.0

      - name: Run project test suite and Firestore security rules tests against real emulators
        run: npx firebase emulators:exec --project demo-restaumax --only firestore,auth "FIRESTORE_EMULATOR_STRICT=true npm test && npx tsx scripts/test-role-authorization.mjs && node scripts/test-security-rules.mjs"

      - name: TypeScript validation
        run: npm run lint

      - name: Production build validation
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high
