name: Audit / migrate legacy private restaurant metadata — Production

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/migrate-legacy-restaurant-private-data.mjs'
      - '.github/workflows/migrate-legacy-private-data-production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN = lecture seule ; APPLY = migration après validation du rapport"
        required: true
        type: choice
        default: DRY_RUN
        options:
          - DRY_RUN
          - APPLY
      confirm_migration:
        description: "Pour APPLY uniquement, sélectionner la confirmation explicite"
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "MIGRATE_LEGACY_PRIVATE_DATA_TO_PRODUCTION"

permissions:
  contents: read

concurrency:
  group: firestore-legacy-private-migration-production
  cancel-in-progress: false

jobs:
  audit-migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: firebase-production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: gen-lang-client-0138815290
      FIRESTORE_DATABASE_ID: ai-studio-restomax-85affd15-48b4-463e-b365-b881673ebbcf

    steps:
      - name: Validate Production target and mode
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.before == '02bbfd228209d7d5661af2345eb4c1ef8c67c501' && 'APPLY' || 'DRY_RUN') }}
          CONFIRM_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_migration || (github.event.before == '02bbfd228209d7d5661af2345eb4c1ef8c67c501' && 'MIGRATE_LEGACY_PRIVATE_DATA_TO_PRODUCTION' || 'NO') }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FIREBASE_PROJECT_ID" = "gen-lang-client-0138815290"
          test "$FIRESTORE_DATABASE_ID" = "ai-studio-restomax-85affd15-48b4-463e-b365-b881673ebbcf"
          PUSH_BEFORE="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_BEFORE" == "02bbfd228209d7d5661af2345eb4c1ef8c67c501" ]]; then
            test "$MODE" = "APPLY"
            test "$CONFIRM_MIGRATION" = "MIGRATE_LEGACY_PRIVATE_DATA_TO_PRODUCTION"
          elif [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$MODE" != "DRY_RUN" ]]; then
            echo "::error::Automatic Production runs are restricted to read-only DRY_RUN except the one-time owner-authorized migration."
            exit 1
          fi
          if [[ "$MODE" == "APPLY" && "$CONFIRM_MIGRATION" != "MIGRATE_LEGACY_PRIVATE_DATA_TO_PRODUCTION" ]]; then
            echo "::error::Explicit Production migration confirmation is required."
            exit 1
          fi
          echo "Mode: $MODE"
          echo "Target: $FIREBASE_PROJECT_ID / $FIRESTORE_DATABASE_ID"

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud using short-lived OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: gen-lang-client-0138815290
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Run read-only audit or explicitly confirmed migration
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.before == '02bbfd228209d7d5661af2345eb4c1ef8c67c501' && 'APPLY' || 'DRY_RUN') }}
          CONFIRM_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_migration || (github.event.before == '02bbfd228209d7d5661af2345eb4c1ef8c67c501' && 'MIGRATE_LEGACY_PRIVATE_DATA_TO_PRODUCTION' || 'NO') }}
        run: |
          set -euo pipefail
          node scripts/migrate-legacy-restaurant-private-data.mjs --dry-run | tee "$RUNNER_TEMP/legacy-migration-dry-run.json"
          if [[ "$MODE" == "APPLY" ]]; then
            node --input-type=commonjs - "$RUNNER_TEMP/legacy-migration-dry-run.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = {
            restaurantsScanned: 5,
            restaurantsNeedingMigration: 4,
            ownerMetadataDocuments: 4,
            subscriptionDocuments: 0,
            canonicalSubscriptionsAlreadyPresent: 0,
            subscriptionConflicts: 0,
            ownerUidConflicts: 0,
            invalidSubscriptions: 0,
            backupConflicts: 0
          };
          for (const [key, value] of Object.entries(expected)) {
            if (report[key] !== value) throw new Error(`Production inventory changed: ${key} expected ${value}, got ${report[key]}`);
          }
          const expectedFields = { ownerUid: 4, ownerName: 4, ownerEmail: 4, createdBy: 4, updatedBy: 3, deletedBy: 3 };
          if (JSON.stringify(report.privateFieldCounts) !== JSON.stringify(expectedFields)) {
            throw new Error('Production private-field inventory changed; refusing migration.');
          }
          if (Object.keys(report.unknownFieldCounts || {}).length !== 0) {
            throw new Error('Unknown Production fields detected; refusing migration.');
          }
          console.log('Production dry-run inventory matches the reviewed snapshot exactly.');
          NODE
            CONFIRM_LEGACY_PRIVATE_MIGRATION="$CONFIRM_MIGRATION" \
              node scripts/migrate-legacy-restaurant-private-data.mjs --apply
          fi

      - name: Summary
        if: success()
        run: |
          echo "Legacy private metadata audit/migration completed for the named Production database."
          echo "Any migrated legacy values were preserved in server-only private migration backup documents."
