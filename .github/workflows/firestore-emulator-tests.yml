name: RestauMax — Tests Firestore Emulator & Qualité

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-emulator:
    name: Validation Transactionnelle Firestore Emulator (Mode Strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Configuration de Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Configuration de Java 21 (Requis pour Firebase CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installation propre et reproductible des dépendances npm
        run: npm ci --legacy-peer-deps

      - name: Mise à jour des dépendances vulnérables sans changement majeur
        run: npm audit fix --legacy-peer-deps

      - name: Commit du lockfile après audit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Aucune mise à jour du lockfile nécessaire."
            exit 0
          fi
          git commit -m "chore: apply safe npm audit fixes"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Audit de sécurité des dépendances npm
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Vulnérabilités npm :', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via,
              nodes: item.nodes
            }, null, 2));
          }
          NODE

      - name: 1. Contrôle statique TypeScript (lint)
        run: npm run lint

      - name: 2. Tests de persistance de l'intention client (test:intent)
        run: npm run test:intent

      - name: 3. Tests unitaires et contrats d'idempotence (test:lot1 & test:lot2)
        run: |
          npm run test:lot1
          npm run test:lot2

      - name: 4. Classification des rejets définitifs et des transactions incertaines
        run: npm run test:order-errors

      - name: 5. Tests sur le véritable Firestore Emulator et Security Rules
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-restaumax "FIRESTORE_EMULATOR_STRICT=true npm run test:emulator && npm run test:rules"

      - name: 6. Validation de la compilation de production (build)
        run: npm run build
