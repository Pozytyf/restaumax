name: RestauMax — Tests Firestore Emulator & Qualité

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-emulator:
    name: Validation Transactionnelle Firestore Emulator (Mode Strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupération du code source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configuration de Node.js 24 (LTS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'npm'

      - name: Configuration de Java 21 (Requis par Firebase CLI)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installation propre des dépendances npm
        run: npm ci --legacy-peer-deps

      - name: Installation des outils de test des règles Firestore
        run: npm install --no-save --package-lock=false --legacy-peer-deps firebase-tools@15.34.2 @firebase/rules-unit-testing@6.0.0

      - name: 1. Contrôle statique TypeScript (lint)
        run: npm run lint

      - name: 2. Tests de persistance de l'intention client (test:intent)
        run: npm run test:intent

      - name: 3. Tests unitaires et contrats d'idempotence (test:lot1 & test:lot2)
        run: |
          npm run test:lot1
          npm run test:lot2
          npm run test:order-lifecycle
          npm run test:qr

      - name: 4. Tests transactionnels et règles de sécurité sur le véritable Firestore Emulator
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-restaumax "npm run seed:local && FIRESTORE_EMULATOR_STRICT=true npm run test:emulator && node scripts/test-owner-uid-emulator.mjs && npx tsx scripts/test-order-kds-cash-integration.mjs && node scripts/test-security-rules.mjs && node scripts/test-cash-payments.mjs"

      - name: 5. Validation de la compilation de production (build)
        run: npm run build
