name: RestauMax — Tests Firestore Emulator & Qualité

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-emulator:
    name: Validation Transactionnelle Firestore Emulator (Mode Strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Configuration de Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Configuration de Java 21 (Requis pour Firebase CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installation des dépendances npm (réconciliation du lockfile)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Commit du lockfile npm régénéré
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Le package-lock.json est déjà synchronisé."
            exit 0
          fi
          git commit -m "chore: regenerate package-lock for npm ci"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Export temporaire du lockfile npm réconcilié
        uses: actions/upload-artifact@v4
        with:
          name: restaumax-package-lock-reconciled
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: 1. Contrôle statique TypeScript (lint)
        run: npm run lint

      - name: 2. Tests de persistance de l'intention client (test:intent)
        run: npm run test:intent

      - name: 3. Tests unitaires et contrats d'idempotence (test:lot1 & test:lot2)
        run: |
          npm run test:lot1
          npm run test:lot2

      - name: 4. Exécution des tests sur le véritable Firestore Emulator (test:emulator en mode strict)
        run: |
          npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-restaumax "FIRESTORE_EMULATOR_STRICT=true npm run test:emulator && npm run test:rules"

      - name: 5. Validation de la compilation de production (build)
        run: npm run build
