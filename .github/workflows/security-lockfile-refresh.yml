name: Refresh dependency lockfile securely

on:
  push:
    branches:
      - security/dependency-audit-fixes
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-fixes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile without force upgrades
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Block high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Typecheck, tests and production build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh dependency lockfile"
          git push origin security/dependency-audit-fixes
